.set { height: auto; min-height: 64px; padding: 10px 12px; border-radius: 20px; background: var(--raise); box-shadow: var(--sh-out-s); font-weight: 600; }
.set > .tic { width: 44px; height: 44px; flex: none; display: grid; place-items: center; border-radius: 14px; background: var(--well2); box-shadow: var(--sh-in); color: var(--ink); }
.set > .tic .ic { width: 24px; height: 24px; }
.sw { width: 50px; height: 30px; border-radius: 15px; background: var(--well2); box-shadow: var(--sh-in); }

#sReset { background: var(--well2); box-shadow: var(--sh-in); color: var(--ink-2); }
.set.confirm, #sReset.confirm { background: #B4433A; color: #fff; box-shadow: none; }
#monetPanel .mrow { background: var(--raise); box-shadow: var(--sh-out-s); border-radius: 18px; }

.hints { grid-template-columns: 1fr; gap: 8px; }
.hcard { flex-direction: row; align-items: center; justify-content: flex-start; gap: 12px; min-height: 64px; padding: 10px 12px; border-radius: 20px;

.hcard .stt { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hcard .stt small { font-size: 13px; font-weight: 600; color: var(--ink-2); line-height: 1.25; }
.hcard.locked { background: var(--well2); box-shadow: var(--sh-in); color: var(--ink-2); }
.hcard .dot { position: static; flex: none; box-shadow: none; }
.hcard > .tic .car, .hcard > .tic .thing { width: 40px; height: auto; }
/* значки экранов — не меньше 18 px и цены — не меньше 20 px на экране, и когда вся игра уменьшена (--k) */
#salon .ic, #cars .ic, #settings .ic, #help .ic { min-width: max(18px, calc(18px / var(--k, 1))); min-height: max(18px, calc(18px / var(--k, 1))); flex: none; }
.cost, .prow .btn, .prest .btn { font-size: max(20px, calc(20px / var(--k, 1))); }
.ztab { height: max(58px, calc(58px / var(--k, 1))); }

.step { background: var(--raise); box-shadow: var(--sh-out-s); }
.step .srn { font-size: 20px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.step .sr .ic { width: 22px; height: 22px; }
.step.done { background: var(--well2); box-shadow: var(--sh-in), inset 0 0 0 1.5px var(--neon-ok); }
.step.next { background: var(--navy); color: #EAF6FF; box-shadow: 0 0 0 1.5px var(--neon), 0 0 12px rgba(56,182,255,.5); }
.step.next .n { color: #A9B1C2; }
.step.last { background: var(--navy); color: #F3D58C; box-shadow: 0 0 0 1.5px var(--neon-g); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }

// там он «успешно» ничего не отправлял (в имитации — не завершался вовсе)
function openLog() {
  L('журнал: открыт');
  const text = logText(), wa = TG.on && window.Telegram?.WebApp;
  const chat = typeof wa?.openTelegramLink === 'function';
  const file = !TG.on && new File([text], 'garazh-log.txt', { type: 'text/plain' });
  const canFile = !!file && !!navigator.canShare?.({ files: [file] });
  queuePopup(`<div class="sheet logsheet">${xbtn}<div class="sh-title">Журнал</div><div class="logst" aria-live="polite"></div>` +
    `<div class="obtns adrow"><button class="btn ok" data-copy>${ICON.copy}Скопировать</button>` +
    (chat ? `<button class="btn light" data-chat>${ICON.share}Отправить в чат</button>` : '') +
    (canFile ? `<button class="btn light" data-file>${ICON.share}Файлом</button>` : '') + '</div>' +
    `<textarea class="logta" readonly>${text.replace(/&/g, '&amp;').replace(/</g, '&lt;')}</textarea></div>`, 0, 'card', 'panel', el => {
    const st = el.querySelector('.logst'), ta = el.querySelector('.logta');
    el.addEventListener('click', async e => {
      if (e.target.closest('[data-copy]')) {
        const ok = await copyText(text, ta);
        st.textContent = ok ? 'Скопировано — вставь в чат' : 'Не получилось скопировать. Выдели текст ниже и скопируй';
        if (!ok) { ta.focus(); ta.select(); }
        L(ok ? 'журнал: скопирован' : 'журнал: копирование не вышло');
      } else if (e.target.closest('[data-chat]')) {
        wa.openTelegramLink(chatLink(text));
        st.textContent = 'Открыто окно Telegram — выбери чат';
        L('журнал: окно чата открыто');
      } else if (e.target.closest('[data-file]')) {
        try { await navigator.share({ files: [file], title: 'Журнал «Гараж»' }); st.textContent = 'Файл передан'; L('журнал: файл передан'); }
        catch (err) { if (err.name !== 'AbortError') { st.textContent = 'Файл не ушёл. Скопируй текст'; L('журнал: файл не ушёл'); } }
      }
    });
  });
}
async function copyText(text, ta) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try { ta.focus(); ta.select(); if (document.execCommand('copy')) return true; } catch {}
  return false;
}
// «Отправить в чат»: t.me/share/url с краткой сводкой — заголовок, строка «запуск», «Среда», дальше строки сводки,
// пока вся ссылка после кодирования не длиннее 3500 знаков (не влезло — «…»)
function chatLink(text) {
  const lines = text.split('\n'), sum = lines.slice(1, lines.indexOf('')), env = sum.find(l => l.startsWith('Среда:'));
  const run = lines.filter(l => /^\S+\s+запуск: /.test(l)).pop()?.replace(/^\S+\s+/, '');
  const head = [lines[0], run, env].filter(Boolean), rest = sum.filter(l => l !== env);
  const base = `https://t.me/share/url?url=${encodeURIComponent(location.href.split(/[?#]/)[0])}&text=`;
  for (let n = rest.length; n >= 0; n--) {
    const link = base + encodeURIComponent([...head, ...rest.slice(0, n)].join('\n') + (n < rest.length ? '\n…' : ''));
    if (link.length <= 3500) return link;
  }
  let body = head.join('\n');
  while ((base + encodeURIComponent(body + '…')).length > 3500) body = body.slice(0, -20);
  return base + encodeURIComponent(body + '…');
}

let AC = null;

function sound(kind) {
  if (kind === 'no') TG.haptic('error');
  if (!s.sound) return;
  try { AC ||= new (window.AudioContext || window.webkitAudioContext)(); } catch { return; }
  const t0 = AC.currentTime;
  NOTES[kind].forEach((hz, k) => {
    const o = AC.createOscillator(), g = AC.createGain(), t = t0 + k * .06;
    o.frequency.value = hz;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.08, t + .01);
    g.gain.exponentialRampToValueAtTime(.0001, t + .18);
    o.connect(g).connect(AC.destination);
    o.start(t); o.stop(t + .2);
  });
}

let keyOnField = false, nearBoxes = new Set();

  washpost: 'Пост мойки', hoses: 'Шланги', dryer: 'Сушка', washlight: 'Подсветка', mats: 'Коврики',
  window: 'Витрина', podium: 'Подиум', chairs: 'Кресла', desk: 'Стойка', plants: 'Растения', chandelier: 'Люстра',
  shelves: 'Стеллажи', forklift: 'Погрузчик', crane: 'Кран', pier: 'Причал', containers: 'Контейнеры', office: 'Диспетчерская', lighthouse: 'Маяк',
};
// Плашка «Бонусы салона»: 4 группы по смыслу, у каждой одна строка с суммой; нажатие раскрывает, из чего она сложилась
const GROUP = fx => fx.coins || fx.bubbles || fx.showcase || fx.refresh ? 0 : fx.fuel || fx.regen ? 1 : fx.cells || fx.slot || fx.store || fx.ship || fx.shipFast ? 3 : 2;
const GNAME = ['Монеты', 'Топливо', 'Гаражи и машины', 'Поле и склад'];
const GICON = () => [ICON.coin, ICON.fuel, GARAGE_IC, ICON.grid];
let openGroups = new Set();
function salonGroups() {
  const parts = [[], [], [], []], sum = n => Core.fxSum(s, n), has = n => Core.fxHas(s, n);
  C.salon.forEach((z, zi) => z.items.forEach((it, k) => { if (Core.built(s, zi, it)) parts[GROUP(z.fx[k])].push(`${ITEM_NAME[it]}: ${fxText(z.fx[k]).replace(/^./, ch => ch.toLowerCase())}`); }));
  if (s.prestige) parts[0].push(`Престиж салона ${s.prestige}: +${Math.round(s.prestige * C.prestige.pct * 100)}% монет`);

  const tiers = C.salon.reduce((a, z, zi) => a + z.items.filter((it, k) => z.fx[k].tier !== undefined && Core.built(s, zi, it)).length, 0);
  const total = [
    `+${Math.round(Core.bonusPct(s) * 100)}% за заказы${has('bubbles') ? ', пузыри −30%' : ''}`,
    `бак +${sum('fuel')}${has('regen') ? ', копится на 25% быстрее' : ''}`,
    [tiers && `+${tiers} ${plural(tiers, 'ступень', 'ступени', 'ступеней')}`, parts[2].length - tiers > 0 && `ещё ${parts[2].length - tiers} ${plural(parts[2].length - tiers, 'бонус', 'бонуса', 'бонусов')}`].filter(Boolean).join(', '),
    [sum('cells') && `+${sum('cells')} клеток`, has('slot') && '+1 слот', has('store') && `склад ${s.storeN} из 4`, has('ship') && `корабль раз в ${has('shipFast') ? 3 : 4} ч`].filter(Boolean).join(', '),
  ];

function bonusesHTML() {

    (openGroups.has(g) ? `<ul>${list.map(x => `<li>${ICON.check}<span>${x}</span></li>`).join('')}</ul>` : '') + '</button>').join('');

// Коллекция: две карточки в ряд, машина 640 px в высшей полученной редкости, пять кружков редкостей внизу.
// Сзади — тонкие края стопки. Не полученная ни разу модель — тёмный силуэт и «?»
const RCH = ['из гаража', 'краска на машину или гараж', 'диски на машину', 'обвес на машину', 'эмблема мастера на машину или удачное слияние'];
// чем редкость отличается от белой — по строкам комплектаций (assets/cars/ПРОМТЫ.md)
const RDIFF = ['Базовая: стальные диски, чёрный пластик', 'Кузов без чёрного пластика, литые диски', 'Гоночные полосы, спойлер', 'Чёрная крыша, подсветка', 'Медная серия'];
const popc = m => [0, 1, 2, 3, 4].filter(r => m & (1 << r)).length;
// машина в окне: помечена, чтобы докачанная картинка 640 px встала на место временной (см. renderAll)
const artOf = a => { const [line, lvl, r, big, mono] = a.split(',').map(Number); return Art.item(line, lvl, !!mono, r, !!big); };
const artBox = (line, lvl, r, big, mono = 0) => { const a = [line, lvl, r, big ? 1 : 0, mono ? 1 : 0].join(','); return `<span class="art" data-art="${a}">${artOf(a)}</span>`; };
// кружки редкостей: полученные — в цвете (обычная — белый с обводкой), неполученные — серые
const rdots = (m, cur = -1) => `<span class="rdots5">${[0, 1, 2, 3, 4].map(r => `<i class="r${r}${m & (1 << r) ? ' on' : ''}${r === cur ? ' now' : ''}" style="--c:var(--r${r})"></i>`).join('')}</span>`;
function stackHTML(line, lvl) {
  const k = Core.key(line, lvl), m = s.seen[k] || 0, top = m ? bestRar(m) : 0, on = Core.rarOn(s), [brand, model] = Core.CARS[line][lvl - 1];
  const under = [...[3, 2, 1, 0].filter(r => r < top), ...[0, 1, 2, 3, 4].filter(r => r > top)].slice(0, 2);
  const edges = on && m ? under.map((r, q) => `<i class="edge${m & (1 << r) ? '' : ' no'}" style="--q:${q + 1};${rv(r)}"></i>`).join('') : '';
  const hunted = s.orders.some((o, oi) => o?.kind === 'hunt' && oi < s.slots && o.items[0].line === line && o.items[0].lvl === lvl);   // охота ищет эту модель
  // задание 25: карточка — плитка машины как на поле (заливка лучшей редкости, цифра уровня в углу), под ней — пять точек редкости
  return `<button class="stack${m ? '' : ' unknown'}${s.fresh[k] ? ' fresh' : ''}${hunted ? ' hunt' : ''}" data-k="${k}"${m ? '' : ' disabled'} aria-label="${m ? nameOf(line, lvl) : 'Неизвестная машина'}">` +
    `<span class="pl r${top}${s.landRar?.[k] !== undefined ? ' land' : ''}" style="${rv(top)}">${m ? Art.item(line, lvl, false, top, true) : Art.item(line, lvl, true, 0)}${badge(lvl)}` +
    (m ? '' : '<b class="sc-q">?</b>') + '</span>' + (m && on ? rdots(m) : '<span class="rdots5"></span>') + '</button>';

// награда этапа коллекции картинками: бак, заряд, монеты, звёзды, трофей
const milePics = rw => [rw.tank && ICON.fuel + rw.tank, rw.charge && Art.item(Core.TRIM, 2, true), rw.coins && ICON.coin + rw.coins, rw.stars && ICON.star + rw.stars,
  rw.trophy && ICON.trophy].filter(Boolean).map(x => `<span class="alt">${x}</span>`).join('');
function renderCollection() {
  const seen = Object.keys(s.seen).length, full = Object.values(s.seen).filter(m => m === 31).length;
  let h = `<div class="view-head">${ICON.cards}<span>${seen}/24</span>${full ? `<span class="bonus on" style="margin-left:auto">${full} ${plural(full, 'полная стопка', 'полные стопки', 'полных стопок')} · ${ICON.coin}+${full}%</span>` : ''}</div>`;

// Новая редкость (и первая машина модели) — на весь экран: затемнение, крупная карточка цвета редкости.

// Экран модели: машина во всю ширину, пять редкостей — свайпом и кружками; у закрытой — силуэт и «как получить»
function modelInfo(line, lvl, r) {

function openModel(line, lvl, r0) {
  const k = Core.key(line, lvl), m = s.seen[k] || 0, on = Core.rarOn(s), [brand, model] = Core.CARS[line][lvl - 1];
  const rs = on ? [0, 1, 2, 3, 4] : [0];
  let cur = Math.min(rs.length - 1, r0 ?? (m ? bestRar(m) : 0));
  const slides = rs.map(r => m & (1 << r) ? `<div class="ms-slide" style="${rv(r)}">${artBox(line, lvl, r, true)}</div>` :
    `<div class="ms-slide no">${artBox(line, lvl, 0, false, 1)}</div>`).join('');
  const html = `<div class="mscreen">${xbtn}<div class="ms-head"><small>${brand}</small><b>${model}</b>` +
    `<span class="ms-meta" style="${rv(m ? bestRar(m) : 0)}">${badge(lvl)}${on ? `<span>${popc(m)} из 5</span>` : ''}</span></div>` +
    `<div class="ms-view"><div class="ms-track" style="--i:${cur}">${slides}</div>` +
    (on ? `<button class="ms-arr l" data-step="-1" aria-label="Предыдущая редкость">${ICON.play}</button><button class="ms-arr r" data-step="1" aria-label="Следующая редкость">${ICON.play}</button>` : '') + '</div>' +
    // все пять редкостей сразу — маленькими картинками: полученные в цвете, закрытые силуэтом; нажал — она крупно
    (on ? `<div class="ms-thumbs">${rs.map(r => `<button data-r="${r}" class="${m & (1 << r) ? 'on' : ''}${r === cur ? ' cur' : ''}" style="${rv(r)}" aria-label="${RNAME[r]}">` +
      (m & (1 << r) ? artBox(line, lvl, r, false) : artBox(line, lvl, 0, false, 1)) + '</button>').join('')}</div>` : '') +
    `<div class="ms-info">${modelInfo(line, lvl, cur)}</div></div>`;
  queuePopup(html, 0, 'card', 'panel', el => {

      el.querySelector('.ms-track').style.setProperty('--i', cur);
      el.querySelectorAll('.ms-thumbs button').forEach((b, q) => b.classList.toggle('cur', q === cur));
      el.querySelectorAll('.ms-arr').forEach(b => { b.hidden = cur + +b.dataset.step < 0 || cur + +b.dataset.step >= rs.length; });

      const dx = e.clientX - x0, dy = e.clientY - y0;

    });

// Машины на сценах салона: на подъёмнике — Pico, в мойке — внедорожник, на подиуме — лучшая (уровень + редкость)

}
const zoneCar = id => ({ workshop: [0, 1], wash: s.seen['1-1'] ? [1, 1] : [0, 2], showroom: bestCar(), depot: [0, 3] }[id]);

let zoneSel = null;

  $('ports').innerHTML = '<b>Гаражи</b>' + PORTS.filter(l => Core.portOpen(s, l)).map(l => {
    const t = s.tiers[l], max = Core.maxTier(s, l), price = Core.tierPrice(t, l);
    return `<div class="prow" data-pl="${l}">${Art.item(l, 1, true)}<span><b>${PORTNAME[l]}</b>ступень ${t}</span>` +
      (t < max ? `<button class="btn gold${s.coins < price ? ' off' : ''}" data-pup="${l}">${ICON.coin}${price}</button>` : '<span class="works">макс.</span>') + '</div>';

// Карточка предмета салона: картинка, название, эффект одной строкой, цена или «Работает»
function itemCard(zi, item) {
  const z = C.salon[zi], k = z.items.indexOf(item), fx = z.fx[k], isBuilt = Core.built(s, zi, item);
  const canBuy = !isBuilt && Core.buildable(s).some(b => b.item === item);
  const [ax, ay] = SALON.anchors[item];
  const vx = Math.max(0, Math.min(360 - 200, ax - 100)), vy = Math.max(0, Math.min(260 - 130, ay - 70));
  const car = zoneCar(z.id);
  const pic = SALON.scene(zi, { ...(s.salon[z.id] || {}), [item]: 1 }, { car: car && ((cx, g, w) => Art.nested(car[0], car[1], cx, g, w)) })
    .replace('viewBox="0 0 360 260"', `viewBox="${vx} ${vy} 200 130"`);
  const act = isBuilt ? `<span class="works">${ICON.check}Работает</span>` :

  return `<div class="sheet narrow" data-z="${zi}">${xbtn}<div class="ipic">${pic}</div><div class="sh-title">${ITEM_NAME[item]}</div>` +

// Раскладка: поле по ширине экрана, заказы — всё, что осталось сверху (сетка 2 × 2 или ряд).
// Высота — видимая высота окна; в Telegram — из Telegram: окно «шторкой» меняется уже после запуска, поэтому fit()
// зовётся и по его событиям. Окно ниже, чем нужно полю с клеткой 30 px и ряду заказов 64 px, — вся игра целиком
// уменьшается (масштаб), чтобы ничего не обрезалось: поле важнее заказов
let fitH = 0, fitK = 1, fitIns = '';
// Раскладка главного экрана (задание 22, вариант C). Сверху вниз: шапка, поле 7 × 9 (зазор 3), три карточки заказов (76 px; если клетка
// выходит меньше 48 — 68 px), плавающая панель. Клетка — по ширине экрана (не больше 64), но так, чтобы всё влезло по высоте.
// Не влезает: клетка уменьшается до 44 px, потом вся игра (--k) до 0,92, потом клетка до 40 и масштаб сколько нужно — заказы не прячутся.
// Уменьшенная игра — на всю ширину экрана. Отступы Telegram (вырез, кнопки) не уменьшаются: --app-top / --app-bottom делятся на масштаб
const PAD_T = 8, PAD_B = 66, PAD_X = 4, BOARD_GAP = 3;
function fit() {
  const app = $('app'), root = document.documentElement.style;
  if (!app.clientWidth) return;
  const vh = TG.on ? TG.height() : innerHeight, hud = app.querySelector('.hud').offsetHeight, ins = TG.on ? TG.insets() : null;
  const cs = getComputedStyle(app), gap = parseFloat(cs.rowGap) || 0, vw = innerWidth;
  // высота без отступов Telegram и постоянная часть (CSS-пиксели при масштабе 1): отступы, шапка, два зазора, карточки заказов, зазоры поля
  const V = ins ? vh - ins.top - ins.bottom : vh;
  const pads = ins ? PAD_T + PAD_B : parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  let oh = 76;
  const F = () => pads + hud + 2 * gap + oh + 8 * BOARD_GAP;
  // ширина игры при масштабе k — на весь экран (не шире 460), клетка по ширине: 7 клеток, 6 зазоров, края
  const wOf = k => Math.min(460, vw / k), cwOf = k => Math.min(64, Math.floor((wOf(k) - 2 * PAD_X - 6 * BOARD_GAP) / 7));
  if (Math.floor((V - F()) / 9) < 48) oh = 68;
  let k = 1, cell = Math.min(cwOf(1), Math.floor((V - F()) / 9));
  if (cell < Math.min(cwOf(1), 44)) {
    k = Math.min(1, V / (F() + 9 * 44)); cell = Math.min(cwOf(k), 44);
    if (k < .92) { cell = Math.max(40, Math.floor((V / .92 - F()) / 9)); k = Math.min(1, V / (F() + 9 * cell)); cell = Math.min(cwOf(k), cell); }
  }
  $('orders').style.setProperty('--oh', oh + 'px');
  k = Math.floor(k * 1000) / 1000;
  root.setProperty('--k', k);
  root.setProperty('--cell', cell + 'px');
  app.style.width = wOf(k) + 'px';
  app.style.marginLeft = (vw - wOf(k) * k) / 2 + 'px';
  if (ins) {
    const key = JSON.stringify(ins);
    root.setProperty('--app-top', ins.top / k + 'px');
    root.setProperty('--app-bottom', ins.bottom / k + 'px');
    root.setProperty('--tg-top', ins.top + 'px');
    root.setProperty('--tg-bottom', ins.bottom + 'px');
    root.setProperty('--vgap', Math.max(0, innerHeight - vh) + 'px');      // окно Telegram ниже страницы — меню над краем окна
    if (key !== fitIns) L(`Telegram: ${ins.full ? 'полноэкранный' : 'обычный'} режим, отступы сверху ${ins.sa[0]}+${ins.ca[0]}, снизу ${ins.sa[1]}+${ins.ca[1]}` +
      `${ins.fallback ? ` (не пришли — запас ${ins.top})` : ''}; ${TG.platform() || '?'} ${TG.version() || '(скрипт Telegram ещё не загружен)'}`);
    fitIns = key;
  }
  app.style.height = TG.on || k < 1 ? vh / k + 'px' : '';
  if (vh !== fitH || k !== fitK) {
    L(`окно: высота ${vh} (innerHeight ${innerHeight}, visualViewport ${Math.round(window.visualViewport?.height || 0)}, Telegram ${TG.on ? Math.round(window.Telegram?.WebApp?.viewportStableHeight || 0) : '—'}), клетка ${cell}`);
    if (k < 1) L(`мало места: высота ${vh}, вся игра уменьшена до ${Math.round(k * 100)}%`);
  }
  fitH = vh; fitK = k;
}
addEventListener('resize', fit);
TG.onChange(fit);
// Telegram: страница не тянется пальцем — touchmove гасится везде, кроме окон с прокруткой (листы, Подсказки, Настройки).
// В старом Telegram (до 7.7) не гасится: там свайп вниз ловит запас прокрутки в 1 px
if (TG.on) document.addEventListener('touchmove', e => {
  if (!document.documentElement.classList.contains('tg-old') && !e.target.closest?.('.view, .sheet, .logta')) e.preventDefault();
}, { passive: false });

// Увеличения экрана нет (задание 13): метатег запрещает его, Safari на iPhone метатег про щипок не слушает — гасим жесты
// и движение двумя пальцами (игра двумя пальцами ничего не делает)
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
// Запасной сброс: страница всё же увеличена — переставить метатег и вернуть (iOS после этого возвращает масштаб 1)
let zoomAt = 0;
function resetZoom() {
  const vp = document.querySelector('meta[name=viewport]'), was = vp.content;
  if (!(window.visualViewport?.scale > 1.01) || Date.now() - zoomAt < 1000) return false;
  zoomAt = Date.now();
  vp.content = 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover';
  setTimeout(() => { vp.content = was; }, 300);
  L('масштаб страницы сброшен');
  return true;
}
window.visualViewport?.addEventListener('resize', resetZoom);

// ── Анимации ───────────────────────────────────────────────────────────────
const anim = (el, frames, opt) => (!RM.matches && el?.animate) ? el.animate(frames, opt) : null;
const center = el => { const r = el.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2, r]; };

function flyEl(html, cls, [x0, y0], [x1, y1], w, ms, delay = 0, scaleTo = 1, fade = .9) {
  if (RM.matches) return;
  const el = document.createElement('div');
  el.className = 'fly ' + cls;
  el.innerHTML = html;
  if (w) el.style.width = w + 'px';
  document.body.appendChild(el);
  const h = el.offsetHeight, ww = el.offsetWidth;
  const a = el.animate([
    { transform: `translate(${x0 - ww / 2}px,${y0 - h / 2}px) scale(1)`, opacity: 1 },
    { transform: `translate(${x1 - ww / 2}px,${y1 - h / 2}px) scale(${scaleTo})`, opacity: fade },
  ], { duration: ms, delay, easing: 'cubic-bezier(.45,0,.2,1)', fill: 'backwards' });
  a.onfinish = () => el.remove();
}
// Крупная плашка над тем, что игрок получил: target — номер клетки или элемент
function floatText(target, html, cls = '', color = '') {
  const box = typeof target === 'number' ? cellEl(target) : target;
  if (!box || RM.matches) return;
  const [x, y] = center(box), el = document.createElement('div');
  el.className = 'floater ' + cls;
  if (color) el.style.setProperty('--fc', color);
  el.innerHTML = html;
  document.body.appendChild(el);
  const w = el.offsetWidth / 2, h = el.offsetHeight / 2, big = cls !== '';
  const left = Math.max(6, Math.min(innerWidth - 2 * w - 6, x - w));     // не вылезать за край экрана
  el.animate([
    { transform: `translate(${left}px,${y - h}px) scale(.5)`, opacity: 0 },
    { transform: `translate(${left}px,${y - h - 26}px) scale(1.12)`, opacity: 1, offset: .18 },
    { transform: `translate(${left}px,${y - h - 38}px) scale(1)`, opacity: 1, offset: .75 },
    { transform: `translate(${left}px,${y - h - 58}px) scale(1)`, opacity: 0 },
  ], { duration: big ? 1500 : 1200, easing: 'ease-out' }).onfinish = () => el.remove();
}
const mulTxt = m => '×' + String(m).replace('.', ',');

function flash(i, color, lucky) {
  const cell = cellEl(i);
  if (!cell || RM.matches) return;
  const d = document.createElement('i');
  d.className = 'flash' + (lucky ? ' lucky' : '');
  if (color) d.style.setProperty('--fc', color);
  cell.appendChild(d);
  anim(d, [{ transform: 'scale(.35)', opacity: 1 }, { transform: `scale(${lucky ? 1.8 : 1.3})`, opacity: 0 }], { duration: lucky ? 520 : 380, easing: 'ease-out' }).onfinish = () => d.remove();
}

const pop = el => anim(el, [{ transform: 'scale(.55)' }, { transform: 'scale(1.12)', offset: .6 }, { transform: 'scale(1)' }], { duration: 320, easing: 'ease-out' });
const shake = el => anim(el, [{ transform: 'none' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(-2px)' }, { transform: 'none' }], { duration: 240 });
const hop = el => anim(el, [{ transform: 'none' }, { transform: 'translateY(-7px) scale(1.04)', offset: .4 }, { transform: 'none' }], { duration: 300, easing: 'ease-out' });
const bump = el => anim(el, [{ transform: 'scale(1)' }, { transform: 'scale(1.15)', offset: .4 }, { transform: 'scale(1)' }], { duration: 260 });
const peek = el => { if (!el) return; el.classList.add('peek'); setTimeout(() => el.classList.remove('peek'), 1600); };
const RCOL = ['#C9CDD2', '#4E9A63', '#2E6BD1', '#7A4BC2', '#E07A22'];

let busyUntil = 0, pendingFx = [], auto = 0;
// ход игры: записать в журнал, нарисовать; окна, открытые по ходу, — «открыла игра», не игрок
function play(ev) {
  if (ev.length) { acted++; logPlay(ev); }
  auto++;
  try { playFx(ev); } finally { auto--; }
}
function playFx(ev) {
  if (!ev.length) return;
  const now = Date.now();
  const done = ev.find(e => e.t === 'orderDone');
  save();
  renderAll();
  if (done && !RM.matches) {   // число монет наверху меняется, когда монеты долетят
    $('coinPill').querySelector('b').textContent = s.coins - done.coins;
    setTimeout(() => { renderHud(); bump($('coinPill')); }, 760);
  }
  busyUntil = now + (done ? 1100 : 450);
  let popDelay = done ? 900 : 380;
  const onField = view === 'field';
  const later = fn => { if (onField) fn(); else pendingFx.push(fn); };   // эффект на поле — когда вернёмся на поле

  for (const e of ev) {
    switch (e.t) {
      case 'spawn': {
        const car = cellEl(e.to)?.querySelector('.car,.thing');
        const [x0, y0] = center(cellEl(e.from)), [x1, y1] = center(cellEl(e.to));
        anim(car, [{ transform: `translate(${x0 - x1}px,${y0 - y1}px) scale(.35)`, opacity: .2 }, { transform: 'none', opacity: 1 }], { duration: 300, easing: 'cubic-bezier(.2,.8,.2,1)' });
        if (s.cells[e.from]?.k === 'port') pop(cellEl(e.from).querySelector('.garage')); else hop(cellEl(e.from));
        if (s.cells[e.from]?.k === 'port' && s.fuel < 1) setTimeout(() => showFuelBub(e.from), 350);
        sound('spawn');
        break;
      }
      case 'merge': {
        const good = e.lucky || (e.same && e.r > 0);              // пара одной редкости — правильно, награда больше
        flash(e.to, good ? RCOL[e.r] : null, good);
        if (good) setTimeout(() => flash(e.to, RCOL[e.r], true), 140);
        pop(cellEl(e.to).querySelector('.car'));
        buzz(e.lucky ? [20, 40, 20] : good ? [15, 30, 15] : 12); sound(e.lucky ? 'lucky' : good ? 'coin' : 'merge');
        break;
      }
      case 'stars': {   // звёзды за одно действие на одной клетке — одной плашкой (слияние + бонус за новую модель)
        if (!onField || e.at === undefined || ev.find(x => x.t === 'stars' && x.at === e.at) !== e) break;
        const n = ev.filter(x => x.t === 'stars' && x.at === e.at).reduce((a, x) => a + x.n, 0);
        const m = ev.find(x => x.t === 'merge' && x.to === e.at);
        if (m?.lucky) floatText(e.at, `<span class="ok">${ICON.up}</span>+${n}${ICON.star}<span class="mul">${mulTxt(C.rarityCoins[m.r])}</span>`, 'fl-rar', RCOL[m.r]);
        else if (m?.same && m.r > 0) floatText(e.at, `<span class="ok">${ICON.check}</span>+${n}${ICON.star}<span class="mul">${mulTxt(C.rarityCoins[m.r])}</span>`, 'fl-rar', RCOL[m.r]);
        else floatText(e.at, `+${n}${ICON.star}`);
        break;
      }
      case 'cert': {
        const [x0, y0] = center(cellEl(e.at)), [x1, y1, r] = center(cellEl(e.to));
        flyEl(Art.item(P, 5), '', [x0, y0], [x1, y1], r.width * .8, 360, 0, .3, 0);
        flash(e.at);
        break;
      }
      case 'needCert':     // машины мягко отскакивают, значки сертификата вздрагивают, открывается карточка
        [e.at, e.from].forEach(i => { hop(cellEl(i)); bump(cellEl(i)?.querySelector('.needcert')); });
        sound('no'); openCert(350);
        break;
      case 'levelCar': later(() => { flash(e.at); pop(cellEl(e.at).querySelector('.car')); }); break;
      // деталь на машину: вспышка на клетке, над ней — новая редкость или «починено»
      case 'repair': case 'rarUp': later(() => {
        flash(e.to, e.t === 'rarUp' ? RCOL[e.r] : '#3E7A57', e.t === 'rarUp');
        pop(cellEl(e.to).querySelector('.car'));
        if (e.t === 'rarUp') floatText(e.to, `<span class="ok">${ICON.up}</span>${RNAME[e.r]}`, 'fl-rar', RCOL[e.r]);
        else floatText(e.to, `<span class="ok" style="--fc:#3E7A57">${ICON.check}</span>${ICON.wrench}`, 'fl-rar', '#3E7A57');
      });
        sound(e.t === 'rarUp' ? 'lucky' : 'build'); buzz([15, 30, 15]); break;
      case 'noCharge': shake(cellEl(e.at)); sound('no'); showWaitBub(e.at, 'charge', fmtCharge(), `${ICON.bolt}<b>+1</b>`); break;
      case 'reward':                       // награда за ролик (задание 16): у мест с сундуком, кораблём, клетками — свои события
        if (e.at >= 0) later(() => { flash(e.at, '#B88A2E'); pop(cellEl(e.at)); });
        if (e.place === 'fuel') bump($('fuelPill'));
        if (e.place === 'double') { bump($('coinPill')); floatText($('coinPill'), `+${e.coins}${ICON.coin}`, 'fl-gold'); }
        sound('unlock'); break;
      case 'cellBuy': flash(e.at, '#B88A2E'); pop(cellEl(e.at)); sound('unlock'); bump($('coinPill')); buzz(12); break;
      case 'taskClaim': break;   // топливо вылетает из кнопки «Забрать» в шапку — см. openDaily
      case 'store': {
        const [x0, y0, r] = center(cellEl(e.from)), [x1, y1] = center($('depotBtn'));
        const c = s.store[s.store.length - 1];
        if (c) flyEl(Art.item(c.line, c.lvl, false, c.r || 0), '', [x0, y0], [x1, y1], r.width, 360, 0, .5);
        setTimeout(() => bump($('depotBtn')), 360); sound('pop');
        break;
      }
      case 'unstore': later(() => { flash(e.to); pop(cellEl(e.to).querySelector('.car')); }); break;
      case 'storeSlot': case 'prestige': sound('build'); bump($(e.t === 'prestige' ? 'starPill' : 'depotBtn')); break;
      case 'ship': later(() => { flash(e.at, '#3D5A79'); pop(cellEl(e.at)); }); sound('unlock'); break;
      case 'evStart': setTimeout(() => bump($('evBtn')), 400); explain('event', popDelay); break;
      case 'evEnd':
        queuePopup(`<div class="sheet narrow card">${xbtn}<span class="bigic">${ICON.flag}</span><div class="sh-title">${EVNAME[e.theme]} закончилась</div>` +
          `<div class="sh-txt">Ступень <b>${e.step} из ${C.event.track.length}</b>. Награды остаются у тебя.</div><button class="okbtn" data-close aria-label="Понятно">${ICON.check}</button></div>`, popDelay, 'level', 'tap');
        break;
      case 'evStep': {
        const [ic, n] = rewardIcon(e.reward);
        setTimeout(() => { floatText($('evBtn'), `${ICON.flag}${e.k + 1}<span class="mul">${ic}${n}</span>`, 'fl-gold'); bump($('evBtn')); }, popDelay);
        if (e.reward[0] === 'trophy') queuePopup(`<div class="sheet narrow card">${xbtn}<span class="bigic">${ICON.trophy}</span><div class="sh-title">Трофей: ${EVNAME[s.ev.theme]}</div>` +
          `<div class="sh-txt">Навсегда +${Math.round(C.event.trophyPct * 100)}% монет за заказы. Трофей — в коллекции.</div><button class="okbtn" data-close aria-label="Понятно">${ICON.check}</button></div>`, popDelay + 400, 'level', 'tap');
        break;
      }
      case 'keyUse': {
        const [x0, y0, r] = center(cellEl(e.from)), [x1, y1] = center(cellEl(e.at));
        flyEl(Art.thing('key'), '', [x0, y0], [x1, y1], r.width * .8, 300, 0, .6, 0);
        flash(e.at); pop(cellEl(e.at)); sound('unlock');
        break;
      }
      case 'open': case 'port': case 'boxOpen': later(() => { flash(e.at); pop(cellEl(e.at)); }); if (e.t === 'port' && e.line === P) explain('cert', popDelay + 200); break;
      case 'gift': if (Monet.canShow('gift')) giftWindow(popDelay + 300);      // и дальше — как у сундука
      case 'chest': case 'crate': case 'bubble': case 'key': case 'claim': case 'broken':
        later(() => { flash(e.at); pop(cellEl(e.at)); if (e.t === 'key') floatText(e.at, `+1${Art.thing('key').replace('class="thing"', 'class="ic" style="width:34px;height:28px"')}`, 'fl-gold'); });
        if (e.t === 'bubble') sound('pop');
        if (e.t === 'key') explain('keys', popDelay + 300);
        if (e.t === 'broken') explain('bench', popDelay + 300);
        if (e.t === 'bubble') explain('bubble', popDelay + 300);
        break;
      case 'swap': {
        const [x0, y0] = center(cellEl(e.to)), [x1, y1] = center(cellEl(e.from));
        anim(cellEl(e.from).querySelector('.car,.thing'), [{ transform: `translate(${x0 - x1}px,${y0 - y1}px)` }, { transform: 'none' }], { duration: 200, easing: 'ease-out' });
        break;
      }
      case 'reject': if (e.at !== undefined) { shake(cellEl(e.at)); sound('no'); } break;
      case 'poor': shake($('coinPill')); sound('no'); if (e.at !== undefined) shake(cellEl(e.at)); break;
      case 'full': hop(cellEl(e.at)); sound('no'); if (s.cells[e.at]?.k === 'port') showPlaque('room', `${ICON.grid}+2`); break;
      case 'noFuel': shake(cellEl(e.at)); shake($('fuelPill')); sound('no'); showFuelBub(e.at); break;
      case 'repair': flash(e.at, '#3E7A57'); pop(cellEl(e.at).querySelector('.car')); sound('coin'); break;
      case 'bubbleBuy': flash(e.at); pop(cellEl(e.at).querySelector('.car')); sound('coin'); bump($('coinPill')); break;
      case 'bubblePop': if (onField) { const [x, y, r] = center(cellEl(e.at)); flyEl('<i class="bub" style="display:block;position:static;width:100%;aspect-ratio:1"></i>', '', [x, y], [x, y], r.width, 260, 0, 1.4, 0); } break;
      case 'fuel': setTimeout(() => bump($('fuelPill')), popDelay); break;
      case 'fuelGift': case 'coinGift': {

// ── Всплывающие карточки: по одной, закрываются касанием или сами ─────────────
const popups = [];
let popupOpen = null;
// mode: 'auto' — закрывается касанием или сама через 2,3 с; 'tap' — касанием в любом месте (не сразу, чтобы не смахнуть);
// 'panel' — касанием по фону или кнопкой «×»
// onOpen(el) — вызывается, когда карточка показана (повесить кнопки)
// opt.hold — не показывать, пока палец на экране или доигрывает слияние; opt.cls — свой фон (затемнение)
function queuePopup(html, delay, snd = 'card', mode = 'auto', onOpen = null, opt = {}) {

  setTimeout(() => { popups.push([html, snd, mode, onOpen, opt]); pump(); }, RM.matches ? 0 : delay);
}
// Редкая машина на заказ, который просит меньшую редкость: отдать только после подтверждения. «Оставить» — крупнее

    `<div class="obtns"><button class="btn ok" data-give aria-label="Отдать">${ICON.check}</button>` +
    `<button class="btn light keep" data-close aria-label="Оставить">${ICON.close}</button></div></div>`, 0, 'card', 'panel', el => {
    el.beforeClose = () => L(gave ? 'редкая машина: отдал' : 'редкая машина: оставил');

// Окно для журнала: [вид, название] — по содержимому карточки
function popName(el) {
  const tx = q => [...el.querySelector(q)?.childNodes || []].map(n => n.textContent.trim()).filter(Boolean).join(' ');
  if (el.querySelector('.rare-ask')) return ['подтверждение', 'отдать редкую машину?'];
  if (el.querySelector('.rcard')) return ['новая машина', `${tx('.rc-head')}: ${tx('.rc-name')}`];
  if (el.querySelector('.mscreen')) return ['экран модели', `экран модели ${tx('.ms-head small')} ${tx('.ms-head b')}`];
  if (el.querySelector('.big .lvl-big')) return ['новый уровень', `новый уровень ${tx('.lvl-big')}`];
  if (el.querySelector('.big-model')) return ['новая машина', `новая машина ${tx('.big-brand')} ${tx('.big-model')}`];
  if (el.querySelector('.big')) return ['награда', 'награда за линейку'];
  const t = tx('.sh-title');
  if (el.querySelector('[data-port]')) return ['гараж', t];
  if (el.querySelector('[data-order]')) return ['заказ', t];
  if (el.querySelector('[data-z]')) return ['предмет салона', `салон: ${t}`];
  if (['Уровень', 'Звёзды', 'Топливо', 'Монеты'].includes(t)) return ['счётчик', `счётчик ${t}`];
  if (t === 'Задания на сегодня') return ['задания дня', t];
  if (HINTS.some(h => h.t === t)) return ['подсказка', `подсказка: ${t}`];

// Окно закрыто касанием, палец ещё на экране: его pointerup и click — не тому, что под окном. Один раз, не дольше 400 мс;
// новое касание снимает перехват сразу
function swallowClick(id) {
  const T = ['pointerdown', 'pointerup', 'click'];
  const off = () => { clearTimeout(timer); T.forEach(t => removeEventListener(t, stop, true)); };
  const stop = e => {
    if (e.type === 'pointerdown') return off();
    if (e.type === 'pointerup' && e.pointerId !== id) return;
    e.preventDefault(); e.stopPropagation();
    if (e.type === 'click') off();
  };
  T.forEach(t => addEventListener(t, stop, true));

}
function pump() {
  if (popupOpen || !popups.length) return;
  if (popups[0][4].hold && (press || dragging || Date.now() < busyUntil)) return setTimeout(pump, 150);
  const [html, snd, mode, onOpen, opt] = popups.shift(), shownAt = Date.now();
  const el = document.createElement('div');
  el.className = 'overlay' + (opt.cls ? ' ' + opt.cls : '');
  el.innerHTML = html;
  // каркас (задание 21): окно, которое открыл игрок, — нижний лист; уведомление и подтверждение — карточка по центру
  const card = !!el.firstElementChild?.matches('.big, .rar, .rcard, .card, .mscreen');
  el.classList.add(card ? 'as-card' : 'as-sheet');
  document.body.appendChild(el);
  popupOpen = el;
  const [cat, name] = popName(el);
  el.logName = name;
  if (!opt.auto) LOG.sum.self[cat] = 1;
  L(`окно: ${name}${opt.auto ? '' : ' (открыл сам)'}`);
  hideFinger();
  sound(snd);
  // появление: лист выезжает снизу 220 мс, карточка — 0,96 → 1 и прозрачность 180 мс (без анимации при «уменьшить движение»)
  const inFrames = card ? [{ transform: 'scale(.96)', opacity: 0 }, { transform: 'none', opacity: 1 }] : [{ transform: 'translateY(100%)' }, { transform: 'none' }];
  anim(el, [{ opacity: 0 }, { opacity: 1 }], { duration: card ? 180 : 220, easing: 'ease-out' });
  anim(el.firstElementChild, inFrames, { duration: card ? 180 : 220, easing: 'cubic-bezier(.2,.8,.2,1)' });
  const close = how => {
    if (popupOpen !== el) return;
    popupOpen = null;
    acted++;
    L(`закрыто «${el.logName}» через ${fs1((Date.now() - shownAt) / 1000)} с${how === 'само' ? ', само' : ''}`);
    el.beforeClose?.();
    // уходит зеркально за 160 мс и сразу перестаёт быть окном: .overlay-out не ловит касаний, проверки по .overlay его не видят
    el.classList.replace('overlay', 'overlay-out');
    anim(el, [{ opacity: 1 }, { opacity: 0 }], { duration: 160, easing: 'ease-in', fill: 'forwards' });
    const out = anim(el.firstElementChild, [...inFrames].reverse(), { duration: 160, easing: 'ease-in', fill: 'forwards' });
    if (out) out.onfinish = () => el.remove(); else el.remove();
    lastInput = Date.now();
    setTimeout(pump, 120);
  };
  // «✕» закрывает по click (палец уже отпущен). Касание в любом месте, по фону и свайп вниз закрывают сразу, а остаток
  // нажатия (pointerup, click) проглатывается — не достаётся тому, что было под окном
  let y0 = null, downIn = false;
  el.addEventListener('pointerup', e => { if (mode === 'panel' && y0 !== null && e.clientY - y0 > 70) { close(); swallowClick(e.pointerId); } y0 = null; });
  el.addEventListener('pointerdown', e => {
    downIn = true;
    y0 = e.clientY;
    if (e.target.closest('[data-close]')) return;
    if (mode === 'auto' || (mode === 'tap' && Date.now() - shownAt > 600) || (mode === 'panel' && e.target === el)) { close(); swallowClick(e.pointerId); }
  });
  // click нажатия, начатого до открытия окна, окну не достаётся (клавиатура — detail 0 — проходит)
  el.addEventListener('click', e => { if (!downIn && e.detail) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
  el.addEventListener('click', e => { if (e.target.closest('[data-close]')) close(); });
  el.close = close;
  if (mode === 'auto') setTimeout(() => close('само'), 2300);
  onOpen?.(el);
  return el;
}

    `<div class="sh-txt">${line === P ? 'Инструменты даёт гараж Мастерской' : 'Детали даёт Ателье'}: сливай одинаковые, пока не получится нужная ступень.</div>` +
    `<button class="btn ok" data-show>Показать гараж</button></div>`, 0, 'card', 'panel', el => el.addEventListener('click', e => {
    if (!e.target.closest('[data-show]')) return;

    const i = s.cells.findIndex(c => c?.k === 'port' && c.line === (line < P ? 0 : line));     // машины любого вида — основной гараж

  if (p === 'double') s.lastBig = { coins: Math.max(60, Core.orderValue(s, s.orders.find(o => o) || { kind: 'big', items: [] }) || 60) };
  if (p === 'chest') { s.daily.goals.forEach(g => { g.have = g.need; g.got = true; }); s.daily.claimed = false; }
  if (p === 'gift' && free() >= 0) s.cells[free()] = { k: 'chest', kind: 'gift', cars: [[0, 2, 0], [0, 3, 0], ['fuel', 15]] };

$('orders').addEventListener('click', e => {
  const now = Date.now(), lock = e.target.closest('.order.locked');
  if (lock) {
    const ev = Core.buySlot(s, +lock.dataset.slot, now);
    if (ev[0]?.t !== 'slot') { shake(lock); if (ev[0]?.t === 'poor') shake($('coinPill')); sound('no'); return; }
    return play(ev);
  }
  const b = e.target.closest('.order[data-o]');
  if (!b) return;
  const oi = +b.dataset.o;
  // готовый заказ — сдать сразу; иначе — раскрыть крупно: что нужно, что уже есть на поле, награда
  if (Core.match(s, s.orders[oi]).ready) return play(Core.deliver(s, oi, now));
  openOrder(oi);
});
const KIND = { quick: 'Быстрый заказ', normal: 'Заказ', big: 'Крупный заказ', showcase: 'Заказ на витрину', event: 'Заказ события', hunt: 'Охота за карточкой' };
function orderSheet(oi) {
  const o = s.orders[oi], m = Core.match(s, o), now = Date.now(), free = Core.refreshFree(s, now) || s.swaps > 0;
  const kic = { showcase: ZICON.showroom, event: ICON.flag, hunt: ICON.cards }[o.kind];
  const ava = kic ? `<span class="kic k-${o.kind}">${kic}</span>` : '';
  const reward = o.kind === 'event' ? `<span class="chip">${ICON.token}${Core.orderTokens(o)}</span>` : o.reward ?
    (o.kind === 'hunt' ? `<span class="chip">${huntChip(o)}</span> ` : '') + `<span class="chip">${altChip(o.reward, Core.orderValue(s, o))}</span>` +
    (o.kind === 'hunt' ? ` <span class="chip">${ICON.star}+${C.late.hunt.stars[0] + C.late.hunt.stars[1] * o.items[0].lvl}</span>` : '') :   // охота: звёзды сверх награды
    `<span class="chip coin">${ICON.coin}${Core.orderValue(s, o)}</span>`;
  const tiles = o.items.map((it, k) => {
    const left = it.n - it.got, have = m.cells[k].length;
    return `<span class="rtile pl${left === 0 ? ' done' : ''}" style="${rv(Math.max(0, it.r))}">${Art.item(it.line, it.lvl)}${badge(it.lvl)}` +
      `${left > 1 ? `<i class="cnt2">×${left}</i>` : ''}${left === 0 || have >= left ? `<i class="tick">${ICON.check}</i>` : '<i class="miss"></i>'}</span>`;
  }).join('');
  return `<div class="sheet" data-order="${oi}">${xbtn}<div class="ohead2">${ava}<div class="sh-title">${KIND[o.kind]}</div></div>` +
    `<div class="obig">${tiles}</div><div class="sh-txt">Награда: ${reward}</div>` +
    `<div class="obtns">${m.any ? `<button class="btn ok" data-give>${ICON.check}Сдать, что есть</button>` : ''}` +
    // замена (задание 23): бесплатная по таймеру или из запаса — «↻ Заменить»; иначе «↻ ▶» за ролик, без заглушек — сколько ждать
    (free ? `<button class="btn light" data-refresh>${ICON.refresh}Заменить</button>` : adBtn('reroll', ICON.refresh, { order: oi }) ||
      `<button class="btn light off" disabled aria-label="Замена позже">${ICON.refresh}${ICON.clock}${mmss(s.refreshAt - now)}</button>`) + '</div></div>';
}
function openOrder(oi) {
  queuePopup(orderSheet(oi), 0, 'card', 'panel', el => (adOffered(el), el.addEventListener('click', e => {
    if (adTap(e, el)) return;
    const now = Date.now();
    if (e.target.closest('[data-give]')) { el.close(); return play(Core.deliver(s, oi, now)); }
    if (e.target.closest('[data-refresh]')) {
      const ev = Core.refreshOrder(s, oi, now);
      if (ev[0]?.t === 'wait') { shake(e.target.closest('[data-refresh]')); sound('no'); return; }
      el.close(); play(ev);
    }
  })));
}

// ── Автосалон: вкладки зон, «+», листание пальцем ─────────────────────────────
$('zoneTabs').addEventListener('click', e => {
  const b = e.target.closest('.ztab');
  if (b) { zoneSel = +b.dataset.z; renderSalon(); }
});
$('bonuses').addEventListener('click', e => {
  const g = e.target.closest('.bgroup');
  if (!g) return;
  const k = +g.dataset.g;
  openGroups.has(k) ? openGroups.delete(k) : openGroups.add(k);
  $('bonuses').innerHTML = bonusesHTML();
});
$('ports').addEventListener('click', e => {
  const b = e.target.closest('[data-pup]'), row = e.target.closest('[data-pl]');
  if (b) {
    const ev = Core.upgradePort(s, +b.dataset.pup);
    if (ev[0]?.t !== 'tier') { shake(b); shake($('coinPill')); sound('no'); return; }
    return play(ev);
  }
  if (row) openPort(+row.dataset.pl);
});
$('prest').addEventListener('click', e => {
  if (!e.target.closest('#prestBtn')) return;
  const ev = Core.buyPrestige(s);
  if (ev[0]?.t !== 'prestige') { shake(e.target.closest('#prestBtn')); shake($('starPill')); sound('no'); return; }
  play(ev);
});
$('scene').addEventListener('click', e => {
  // «+», купленный предмет на сцене или значок эффекта под сценой — карточка предмета
  const b = e.target.closest('.plus, [data-item]');
  if (b) openItem(zoneSel, b.dataset.item);
});
let swipeX = null;
$('scene').addEventListener('pointerdown', e => { swipeX = e.clientX; });
$('scene').addEventListener('pointerup', e => {
  if (swipeX === null) return;
  const dx = e.clientX - swipeX;
  swipeX = null;
  if (Math.abs(dx) < 50) return;
  zoneSel = Math.max(0, Math.min(C.salon.length - 1, zoneSel + (dx < 0 ? 1 : -1)));
  renderSalon();
  swallowClick(e.pointerId);      // сцена перерисована — click свайпа не нажимает «+» новой зоны
});

// ── Меню, коллекция, настройки ─────────────────────────────────────────────
function setView(v) {
  acted++;
  if (v !== view) { L(`вкладка: ${VIEWNAME[v]}`); LOG.sum.self['вкладка ' + VIEWNAME[v]] = 1; }
  if (v === 'salon') rep.build.done = true;
  if (view === 'cars' && v !== 'cars') { s.fresh = {}; save(); }
  if (v === 'salon' && view !== 'salon') zoneSel = null;
  view = v;
  hidePop();
  $('field').style.display = v === 'field' ? 'contents' : 'none';
  ['salon', 'cars', 'shop', 'help', 'settings'].forEach(id => { $(id).hidden = v !== id; });
  [...$('dock').children].forEach(b => b.setAttribute('aria-current', String(b.dataset.view === v || (v === 'help' && b.dataset.view === 'settings'))));   // подсказки — из Настроек
  renderAll();
  if (v === 'field') {
    fit();
    pendingFx.forEach(fn => fn());
    pendingFx = [];
  }
}
$('dock').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.view === 'shop' && view !== 'shop') L('магазин из панели'); setView(b.dataset.view); });
$('help').addEventListener('click', e => { const b = e.target.closest('.hcard[data-h]'); if (b) openHint(b.dataset.h); });
$('cars').addEventListener('click', e => {
  const b = e.target.closest('.stack');
  if (!b || b.disabled) return;
  const [line, lvl] = b.dataset.k.split('-').map(Number);
  openModel(line, lvl);
});
$('sHelp').addEventListener('click', () => setView('help'));
$('sSound').addEventListener('click', () => { s.sound = !s.sound; save(); renderSettings(); sound('coin'); });
let resetTimer = 0;
$('sReset').addEventListener('click', () => {
  const b = $('sReset');
  if (!b.classList.contains('confirm')) {
    b.classList.add('confirm');
    renderSettings();
    resetTimer = setTimeout(() => { b.classList.remove('confirm'); renderSettings(); }, 3000);
    return;
  }
  clearTimeout(resetTimer);
  b.classList.remove('confirm');
  const keep = { sound: s.sound };
  s = Object.assign(freshGame(), keep);
  s.fresh = {};
  LOG.sum = freshSum('с начала новой игры');
  L('новая игра (Настройки)');
  readyIds = new Set();
  initHints();
  save();
  lastInput = 0;
  setView('field');
});

$('sLogSend').addEventListener('click', openLog);
let logClearTimer = 0;
$('sLogClear').addEventListener('click', () => {          // как «Новая игра»: второе нажатие подтверждает
  const b = $('sLogClear');
  if (!b.classList.contains('confirm')) {
    b.classList.add('confirm'); renderSettings();
    logClearTimer = setTimeout(() => { b.classList.remove('confirm'); renderSettings(); }, 3000);
    return;
  }
  clearTimeout(logClearTimer);
  b.classList.remove('confirm');
  LOG = { n: LOG.n, ev: [], sum: freshSum('с очистки журнала'), cut: 0 };
  L('журнал очищен');
  logSaveNow();
  renderSettings();
});

// Каждую секунду: топливо копится по часам, пузыри лопаются, раз в день — подарок и задания
setInterval(() => {
  const was = s.fuel, now = Date.now();
  const ev = Core.tick(s, now);
  if (s.n.orders > 0) ev.push(...Core.dailyGift(s, todayKey()), ...Core.eventTick(s, dayIdx(), now), ...Core.arrive(s, now));
  if (ev.length) play(ev);
  else if (s.fuel !== was) {
    save(); renderHud();
    if (was < 2) { if (dragging) boardDirty = true; else renderBoard(); }
  }
  renderHud();
  document.querySelectorAll('.timer').forEach(t => { t.textContent = t.hasAttribute('data-charge') ? fmtCharge() : fmtWait(); });
  document.querySelectorAll('.cell.bubble').forEach(el => {
    const c = s.cells[+el.dataset.i];
    if (c?.k === 'bubble') el.style.setProperty('--p', Math.max(0, (c.until - now) / C.bubbleMs).toFixed(3));
  });
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { Core.tick(s, Date.now()); renderAll(); } });

// Для проверки и снимков экрана: window.G.s — состояние, G.set(состояние) — подменить
// Монетизация (задание 12): без ?monet=1 провайдера нет — Monet ничего не показывает
Monet.attach({ s: () => s, day: dayIdx, today: todayKey, now: () => Date.now(), log: L, save,
  reward: (place, ctx) => { const ev = Core.reward(s, place, Date.now(), ctx); if (ev[0].t !== 'reward') return false; play(ev); return true; },
  // магазин (задание 17): товар выдают правила; тест вкл / выкл — копилка и запас баков в правилах
  canGrant: (id, day) => Core.canGrant(s, id, Date.now(), day), grant: (id, day) => play(Core.grant(s, id, Date.now(), day)),
  price: id => C.shop.items[id].price, setOn: on => Core.setMonetOn(on) });
window.G = { get s() { return s; }, set(v) { s = Core.migrate(v); s.fresh ||= {}; s.day0 ||= todayKey(); noteRefund(); initHints(); save(); hideFinger(); hidePop(); renderAll(); fit(); },
  Core, Art, play, setView, hidePop, openDaily, openHint, openPort, openCard, levelCard, starCard, fuelCard, coinCard, openDepot, eventSheet, openItem, explain, queuePopup, HINTS };

Art.loadRasters(renderAll);
renderAll();
fit();

// Telegram: сохранение на телефоне пустое или старше облачной копии — берём облачную
if (TG.on) TG.cloudLoad((str, at) => {
  let v = null;
  try { v = str && JSON.parse(str); } catch {}
  const ok = v && v.v >= 3 && Array.isArray(v.cells) && v.cells.length === Core.N;
  const newer = ok && (!saved || (saved.at || 0) < at);
  L(`облако Telegram: ${!ok ? 'копии нет' : newer ? 'копия новее, чем на телефоне' : 'копия не новее, чем на телефоне'}`);
  if (newer) { TG.cloud.restored = true; G.set(v); L('сохранение восстановлено из облака Telegram'); }
});

// Обновление: страница могла остаться в кэше (Telegram держит старую) — сверить номер сборки с сайтом
// и один раз перезагрузиться; отметка в sessionStorage не даёт зациклиться. Нет сети или файла — ничего не происходит
const BUILD_N = 25;                        // build-public.js подставляет номер сборки; 0 — прототип, не проверяется
if (BUILD_N) fetch('version.json', { cache: 'no-store' }).then(r => r.json()).then(v => {
  L(`проверка версии: на сайте сборка ${v.build}, запущена ${BUILD_N}`);
  if (!(v.build > BUILD_N)) return;
  let again = true;
  try { again = sessionStorage.getItem('garazh.reload') === String(v.build); if (!again) sessionStorage.setItem('garazh.reload', v.build); } catch {}
  if (again) return L(`перезагрузка на сборку ${v.build} уже была — остаётся ${BUILD_N}`);
  L(`перезагрузка на сборку ${v.build}`);
  logSaveNow();
  const u = new URL(location.href);
  u.searchParams.set('v', v.build);
  location.replace(u.href);
}).catch(() => L('проверка версии: нет ответа'));
// без интернета игра открывается из памяти телефона; нет поддержки (встроенный браузер Telegram) — игра работает и так
try { if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {}); } catch {}
</script>
